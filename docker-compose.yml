version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: callsphere-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: callsphere
      POSTGRES_PASSWORD: callsphere_password
      POSTGRES_DB: callsphere_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callsphere -d callsphere_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: callsphere-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: callsphere-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://callsphere:callsphere_password@postgres:5432/callsphere_db
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
      - SECRET_KEY=callsphere_super_secret_jwt_key_for_production_use_only
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: callsphere-worker
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://callsphere:callsphere_password@postgres:5432/callsphere_db
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
      - SECRET_KEY=callsphere_super_secret_jwt_key_for_production_use_only

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: callsphere-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
  uploads_data:
